# Predico training configuration

random_state: 42

dataset:
  training_data_path: './dataset/training_data.csv'
  test_data_path: './dataset/test_data.csv'

# Honest evaluation: CV on deduplicated rows, plus a "real user" score
# where each case only reports this many of its symptoms.
eval:
  folds: 5
  partial_symptoms: 3

model:
  decision_tree:
    criterion: 'entropy'
  random_forest:
    n_estimators: 300
  naive_bayes:
    alpha: 1.0

model_save_path: './saved_model/'
